services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: achktpocr:local
    ports:
      - "${OCR_BIND_IP:-127.0.0.1}:8000:8000"
    environment:
      APP_ENV: production
      APP_API_KEY: ${APP_API_KEY:?Set APP_API_KEY to a strong secret}
      APP_OCR_ENABLED: "true"
      APP_UPLOAD_MAX_BYTES: ${APP_UPLOAD_MAX_BYTES:-10485760}
      APP_MAX_IMAGE_DIMENSION: ${APP_MAX_IMAGE_DIMENSION:-8000}
      APP_MAX_IMAGE_PIXELS: ${APP_MAX_IMAGE_PIXELS:-16000000}
      APP_OCR_MAX_SIDE: ${APP_OCR_MAX_SIDE:-2500}
      APP_MODEL_MANIFEST: models/manifest.json
      APP_LOG_LEVEL: INFO
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped
