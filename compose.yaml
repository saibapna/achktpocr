services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aceh-ktp-ocr:local
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_API_KEY: ${APP_API_KEY:?Set APP_API_KEY in the host environment}
      APP_UPLOAD_MAX_BYTES: ${APP_UPLOAD_MAX_BYTES:-10485760}
      APP_MAX_IMAGE_DIMENSION: ${APP_MAX_IMAGE_DIMENSION:-8000}
      APP_MODEL_MANIFEST: models/manifest.json
      APP_LOG_LEVEL: INFO
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
