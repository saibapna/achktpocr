services:
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile.benchmark
    image: achktpocr-benchmark:local
    environment:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
    command: ["--synthetic", "--tessdata-dir", "/models/benchmark", "--output", "/reports/ocr_benchmark.json"]
    volumes:
      - ./models/benchmark:/models/benchmark:ro
      - ./reports:/reports
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
