[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aceh-ktp-ocr"
version = "0.1.0"
description = "Standalone KTP-el OCR API using YOLO and pluggable OCR engines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License not selected" }
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic>=2.8,<3.0", "pydantic-settings>=2.4,<3.0", "python-multipart>=0.0.9", "Pillow>=10.4,<13.0"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.3,<9.0", "ruff>=0.6,<1.0", "mypy>=1.11,<2.0"]
vision = ["opencv-python-headless>=4.10,<5.0", "ultralytics>=8.3,<9.0"]
paddle = ["paddleocr>=2.8,<4.0"]
tesseract = ["pytesseract>=0.3.13,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
